# Sandbox for the email-agent prompt-injection experiments.
#
#   agent ──(sandbox_internal, internal: true, no internet)──► llm-gateway ──(llm_egress)──► host Ollama :11434
#
# The agent has no route anywhere except the gateway. The gateway forwards only
# the whitelisted Ollama inference endpoints (see gateway/nginx.conf).
# Ollama runs natively on the Windows host so it can use the AMD GPU.

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: email-agent-sandbox:0.1
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    environment:
      OLLAMA_BASE_URL: http://llm-gateway:11434
      MODEL: ${MODEL:-qwen3:8b}
      NUM_CTX: ${NUM_CTX:-16384}
      TEMPERATURE: ${TEMPERATURE:-0.3}
      MAX_STEPS: ${MAX_STEPS:-15}
      EPISODE_TIMEOUT_S: ${EPISODE_TIMEOUT_S:-300}
      CALL_TIMEOUT_S: ${CALL_TIMEOUT_S:-180}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}   # set on the host: GIT_COMMIT=$(git rev-parse --short HEAD)
    volumes:
      # Only these two host folders are visible. Never mount $HOME, ~/.ssh or docker.sock.
      - ./benchmark:/data/benchmark:ro
      - ./results:/data/results:rw
    networks:
      - sandbox_internal
    depends_on:
      - llm-gateway

  llm-gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    # Skip the image's entrypoint scripts (they try to edit files on a read-only fs).
    entrypoint: ["nginx", "-g", "daemon off;"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sandbox_internal
      - llm_egress
    restart: unless-stopped

networks:
  sandbox_internal:
    internal: true      # no external connectivity for anything attached only to this network
  llm_egress:
    driver: bridge      # gateway only; used solely to reach host Ollama

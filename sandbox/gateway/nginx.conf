# Whitelisting reverse proxy: the agent may call only Ollama's inference endpoints.
# Model management (/api/pull, /api/delete, /api/create, /api/push, /api/copy) and everything else -> 403.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 64; }

http {
    access_log /dev/stdout;
    server_tokens off;
    client_max_body_size 4m;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # host.docker.internal resolves to an IPv4 and an (unreachable) IPv6 address.
    # max_fails=0: never mark the host dead after a transient failure (a single
    # timeout previously disabled both addresses and failed every later request).
    upstream ollama_host {
        server host.docker.internal:11434 max_fails=0;
    }

    server {
        listen 11434;

        proxy_http_version 1.1;
        # Ollama rejects non-local Host headers when bound to loopback.
        proxy_set_header Host "localhost:11434";
        proxy_set_header Origin "";
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        location = /api/version          { limit_except GET  { deny all; } proxy_pass http://ollama_host; }
        location = /api/tags             { limit_except GET  { deny all; } proxy_pass http://ollama_host; }
        location = /api/show             { limit_except POST { deny all; } proxy_pass http://ollama_host; }
        location = /api/chat             { limit_except POST { deny all; } proxy_pass http://ollama_host; }
        location = /v1/models            { limit_except GET  { deny all; } proxy_pass http://ollama_host; }
        location = /v1/chat/completions  { limit_except POST { deny all; } proxy_pass http://ollama_host; }

        location / { return 403; }
    }
}
